<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>All PIC Summary</title>
  <link rel="stylesheet" href="dashUI.css" />
</head>
<body>
  <div class="dashboard">
    <h1>All Makers - PIC Status Summary</h1>
    <div class="dashboard-actions">
      <button id="backToDashboard">← Back to Dashboard</button>
    </div>


    <div class="dashboard-actions">
      <label>Maker:
        <select id="summaryMakerSelect"></select>
      </label>
      <label>Event:
        <select id="summaryEventSelect"></select>
      </label>
    </div>

    <div class="summary-table-wrap">
      <table class="summary-table" id="picSummaryTable">
        <thead>
          <tr>
            <th>PIC</th>
            <th>OPEN</th>
            <th>CLOSE</th>
            <th>CANCELLED</th>
            <th>REJECTED</th>
            <th>TOTAL</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="picsummary.js"></script>
</body>
</html>
