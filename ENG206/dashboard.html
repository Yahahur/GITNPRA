<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Car Maker Status Dashboard</title>
  <link rel="stylesheet" href="dashUI.css" />
</head>
<body>

    <div class="dashboard">
        <h1>NPRA Monitoring Dashboard</h1>

        <div class="dashboard-actions">
          <button id="exportAllDataBtn">💾 Export All Makers Data</button>
          <button id="importAllDataBtn">📂 Import All Makers Data</button>
          <input type="file" id="importAllDataInput" accept="application/json" style="display:none" />
        </div>

        <div class="maker-grid" id="makerGrid">
            <!-- Cards generated by JS -->
        </div>
    </div>

    <script src="dashscript.js"></script>
</body>
</html>
